【通用 Codex 模板（固定分支 + tools/_cache + 不死循環 + 新電腦路徑 + Namespace Handoff/Compat）】

請在 RepoRoot 對 TargetModId 執行「一次」完整流程：
sync →（若有）套用翻譯(Overwrite) → 產生下一批 keys（最多 200，不重複）
→ 計算進度 → commit/push → 再計算進度。
注意：整個流程只允許執行一次，不得使用 while / 迴圈重跑。

────────────────────────────────────────────────────────
【固定環境（新電腦）】
RepoRoot: D:\stoneblock4-zh_tw
GameRoot: C:\Users\USER\AppData\Roaming\PrismLauncher\instances\FTB StoneBlock 4\minecraft
ModsDir: %GameRoot%\mods
PackName: sb4-zh_tw
OutDir: D:\stoneblock4-zh_tw\tools\out
CacheRoot: D:\stoneblock4-zh_tw\tools\_cache
KeysPerMod: 200

【本次目標模組（只改這行）】
TargetModId: <MODID>
; NOTE: UTF-8 here-string issue hit twice; always set $OutputEncoding and [Console]::OutputEncoding to UTF8 before writing zh_tw JSON.

【固定分支（禁止 batch）】
WorkBranch: i18n/<MODID>
（例：i18n/rarcompat、i18n/fzzy_config）

【翻譯暫存檔（持久，不會因 rebase 消失）】
TranslatedBundle: %CacheRoot%\<MODID>\bundle_translated.json

【待翻譯輸出（可視為暫存，可能被清掉也沒關係）】
ToTranslateBundle: %OutDir%\<MODID>\bundle_to_translate.json
GeminiPrompt:    %OutDir%\<MODID>\gemini_prompt.txt
StatsJson:       %OutDir%\<MODID>\bundle_source_stats.json（若有）

【Compat/外來 namespace 轉交（handoff）】
EnableNamespaceHandoff: true
HandoffOutDir: %OutDir%\_handoff\<MODID>
（輸出會依 namespace 再分資料夾：%OutDir%\_handoff\<MODID>\<NS>\...）
HandoffMaxNamespaces: 3
HandoffKeysPerNs: 200
────────────────────────────────────────────────────────

【Guard Rules（避免卡關/死循環；必須遵守）】
G1: pull/rebase 前若 working tree 非乾淨（git status --porcelain 非空）：
    - git stash push -u -m "codex-auto-stash"
    - 完成後 git stash pop
    - 若 pop 失敗：停止並回報衝突檔案（不得繼續）

G2: apply step 永遠可選：
    - 若 TranslatedBundle 不存在：回報 "apply skipped" 並直接進下一步（不得中止）

G3: make-bundle 後 entries==0：
    - 不得立刻 stop；必須先執行一次「Namespace Audit + Handoff」（若 EnableNamespaceHandoff=true）
    - 若 audit 後仍無任何 handoff keys → 才回報 "no new keys, stop" 並停止
    - 禁止使用 while/迴圈重跑 make-bundle（仍然只允許一次）

G4: 重複檢查必須「全量比對」：
    - dup = bundleKeys ∩ existingRepoZhTwKeys
    - 若 dup.length > 0：停止並列出前 50 個 dup keys（不要重試/不要迴圈）

G5: push 失敗：停止並回報錯誤（不得重跑整段流程）

G6: tools/out 與 tools/_cache 必須在 .gitignore；
    - 若 git status 顯示它們被 stage/追蹤：停止並修正 .gitignore（不要硬 commit）

G7: 若觸發 handoff：
    - 必須清楚回報：HandoffNamespaces、每個 namespace 的 keys 數量、各自輸出路徑
    - Step 4 進度計算需同時輸出：<MODID> 與每個 handoff namespace 的 progress + source 兩行
────────────────────────────────────────────────────────
【流程】

0) Git 同步（自動 fallback，不可中止流程）
   cd %RepoRoot%
   git fetch --all --prune

   # G1: auto-stash
   若 git status --porcelain 非空：
     git stash push -u -m "codex-auto-stash"

   git checkout main
   嘗試 git pull --rebase；若失敗 → 改 git pull；若仍失敗 → 回報錯誤但繼續往下做

   # G1: pop stash
   若前面有 stash：
     git stash pop
     若失敗：停止並回報衝突檔案（不得繼續）

1) 準備固定工作分支（禁止 batch）
   - 若 WorkBranch 不存在：
       git checkout -b WorkBranch
     否則：
       git checkout WorkBranch
       git rebase main
       若 rebase 失敗：停止並回報衝突檔案（不得繼續）

2) 套用翻譯（強制驗證 resourcepacks 產物）
   - 確保 %CacheRoot%\<MODID>\ 目錄存在
   - 若 TranslatedBundle 不存在：
       回報 "apply skipped (missing translated bundle at tools/_cache)" 並直接進下一步
     若存在：
       執行 tools\extract-zh-cn-to-zh-tw.ps1 -Overwrite
       回報 Apply summary（totalMods/applied/skipped/created/updated/failed）
       若 failed > 0：停止並列出 failed keys/原因

       【產物驗證（必做）】
       目標檔：resourcepacks\sb4-zh_tw\assets\<MODID>\lang\zh_tw.json
       - 若目標檔不存在：停止並回報 "apply produced no zh_tw.json"
       - 若目標檔存在但本次沒有任何變更（git status 無變更）：
           回報 "apply made no repo changes"（允許繼續產生下一批，但要清楚提示）

3) 產生下一批 keys（最多 200，不重複；只執行一次）
   - 執行 tools\make-gemini-bundle.ps1（TargetModId=<MODID>, KeysPerMod=%KeysPerMod%）
   - 回報輸出路徑：
       ToTranslateBundle、GeminiPrompt、StatsJson（若有）
   - 讀取 ToTranslateBundle：
       bundleKeys = entries keys 數量
       若 1 <= bundleKeys < 200：回報 "entries < 200, near completion"（仍需保留輸出）
   - G4 全量重複檢查：
       existingRepoZhTw = resourcepacks\sb4-zh_tw\assets\<MODID>\lang\zh_tw.json keys（不存在視為空）
       dup = intersection(bundleKeys, existingRepoZhTw)
       若 dup.length > 0：停止並列出前 50 個 dup keys（不要重試）

   - 若 bundleKeys == 0：
       回報 "no new keys for <MODID> (bundle entries==0), run namespace-audit/handoff first"（G3）
       若 EnableNamespaceHandoff=true：執行一次「Namespace Audit + Handoff」（見下段）
       若 handoff 仍然沒有任何 keys：回報 "no new keys, stop" 並停止
       若 handoff 有 keys：回報 "handoff generated, continue to Step 4 (progress)" 並繼續

   【Namespace Audit + Handoff（只執行一次；不得迴圈）】
   目的：當 TargetModId 產生 0 keys，但來源 jar 內含大量「非 <MODID> namespace」的 key（常見於 compat/addon），
         需要把那些 keys 轉交到正確的 namespace（例如 rarcompat → relics）。

   A) 找出 TargetModId 對應的 jar（不要用檔名猜，用 zip entry 檢查；zip 路徑用 '/'）
      - 在 ModsDir 下枚舉 jar，檢查是否含 assets/<MODID>/lang/en_us.json
        若不存在 fallback assets/<MODID>/lang/en_us.lang
      - 記錄 jarName 與 entryPath（例如 assets/<MODID>/lang/en_us.json）

   B) 在該 jar 內枚舉所有語系 entry
      - 列出所有 assets/*/lang/en_us.json（若沒有則列出 assets/*/lang/en_us.lang）
      - 將每個 entry 的 namespace 記為 <NS>（即 assets/<NS>/lang/en_us.json 的 <NS>）

   C) 產生 HandoffNamespaces
      - HandoffNamespaces = {所有 <NS>，排除 <MODID>}
      - 依「candidate keys 數量」由大到小排序，取前 HandoffMaxNamespaces 個（預設 3）
      - 若 HandoffNamespaces 為空：回報 "namespace-audit found no foreign namespaces"

   D) 對每個 <NS> 輸出 handoff bundle（最多 200 keys；不得擴增/重跑）
      - 目錄：%HandoffOutDir%\<NS>\
      - keys 來源：
          jar 內 assets/<NS>/lang/en_us.json（或 en_us.lang）的 keys
          existingRepoZhTw = resourcepacks\sb4-zh_tw\assets\<NS>\lang\zh_tw.json keys（不存在視為空）
          candidate = en_us_keys - existingRepoZhTw
          取前 HandoffKeysPerNs（預設 200）個輸出
      - 輸出：
          ToTranslateBundle: %HandoffOutDir%\<NS>\bundle_to_translate.json
          GeminiPrompt:      %HandoffOutDir%\<NS>\gemini_prompt.txt
          StatsJson:         %HandoffOutDir%\<NS>\bundle_source_stats.json（若有）
      - 另外做一次 G4 重複檢查（對 <NS>）：
          dup = candidateSelected ∩ existingRepoZhTw
          若 dup.length > 0：停止並列出前 50 個 dup keys（不要重試）

   E) 回報 audit/handoff summary（G7）
      - jar=<jarName>
      - namespaces found: <NS list>
      - handoff generated:
          <NS1>: <count> keys → %HandoffOutDir%\<NS1>\...
          <NS2>: <count> keys → %HandoffOutDir%\<NS2>\...
          ...

4) 計算並輸出進度（push 前後都要）
   - 自動找出含 assets/<MODID>/lang/en_us.json 的 jar（zip entry 檢查；不要用檔名猜；zip 路徑用 '/'）
     若不存在 fallback assets/<MODID>/lang/en_us.lang
   - total：en_us key 數
   - translated：repo 的 zh_tw.json 與 en_us key 交集數（不存在視為 0）
   - 輸出兩行：
     <MODID> progress: translated=__ / total=__, remaining=__, percent=__._%
     <MODID> source: jar=<jarName>, entry=<entryPath>, totalKeys=<N>

   - 若本次有觸發 handoff（僅限本次實際輸出 bundle 的 namespaces）：
       對每個 <NS> 同樣計算並輸出兩行：
         <NS> progress: translated=__ / total=__, remaining=__, percent=__._%
         <NS> source: jar=<jarName>, entry=assets/<NS>/lang/en_us.json (or .lang), totalKeys=<N>

5) Git（有變更才提交；tools/out、tools/_cache 不提交）
   - git status -sb
   - 若沒有任何變更：回報 "no changes, skip commit/push" 並停止
   - 否則：
       確認 .gitignore 已忽略 tools/out/** 與 tools/_cache/**（以及 tools/out/_handoff/**）
       若 git status 顯示 tools/out 或 tools/_cache 或 tools/out/_handoff 被追蹤/stage：停止並修正 .gitignore（G6）
       git add -A
       commit message：
         - 若未觸發 handoff："<MODID>: apply bundle and next keys"
         - 若有 handoff："<MODID>: apply bundle + handoff(<NS1>,<NS2>) and next keys"
       git push --set-upstream origin WorkBranch
       若 push 失敗：停止並回報錯誤（G5）

   - push 後再輸出一次同樣的 progress + source 兩行
     （若有 handoff namespaces，也要再輸出它們各自的 progress + source 兩行）
────────────────────────────────────────────────────────
