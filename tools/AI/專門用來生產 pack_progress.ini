【輸出（console）】
A) 讀取 OutCsv 並計算 overall（不中斷；若解析錯誤請列出錯誤）：
   - sb4-zh_tw overall progress: translated=__ / total=__, remaining=__, percent=__._%

B) 表格前 30 行（依 CSV 目前排序的前 30 筆；欄位固定輸出）：
   - modid translated total remaining percent

C) CSV 路徑：
   - D:\stoneblock4-zh_tw\tools\AI\pack_progress.csv

D) 任何讀取/解析錯誤（不中斷；只回報）

【PowerShell（只讀輸出）】
$csv = Import-Csv "D:\stoneblock4-zh_tw\tools\AI\pack_progress.csv"
$tTranslated = ($csv | Measure-Object -Property translated -Sum).Sum
$tTotal = ($csv | Measure-Object -Property total -Sum).Sum
$tRemaining = $tTotal - $tTranslated
$pct = if ($tTotal -eq 0) { 0 } else { [math]::Round(($tTranslated / $tTotal) * 100, 1) }
Write-Host ("sb4-zh_tw overall progress: translated={0} / total={1}, remaining={2}, percent={3}%" -f $tTranslated, $tTotal, $tRemaining, $pct)
$csv | Select-Object -First 30 -Property modid,translated,total,remaining,percent | Format-Table -AutoSize
