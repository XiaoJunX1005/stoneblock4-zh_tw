【通用 Codex 模板（固定分支 + tools/_cache + 不死循環 + 新電腦路徑）】

請在 RepoRoot 對 TargetModId 執行「一次」完整流程：
sync →（若有）套用翻譯(Overwrite) → 產生下一批 keys（最多 200，不重複） → 計算進度 → commit/push → 再計算進度。
注意：整個流程只允許執行一次，不得使用 while / 迴圈重跑。

────────────────────────────────────────────────────────
【固定環境（新電腦）】
RepoRoot: D:\stoneblock4-zh_tw
GameRoot: C:\Users\USER\AppData\Roaming\PrismLauncher\instances\FTB StoneBlock 4\minecraft
ModsDir: %GameRoot%\mods
PackName: sb4-zh_tw
OutDir: D:\stoneblock4-zh_tw\tools\out
CacheRoot: D:\stoneblock4-zh_tw\tools\_cache
KeysPerMod: 200

【本次目標模組（只改這行）】
TargetModId: <MODID>

【固定分支（禁止 batch）】
WorkBranch: i18n/<MODID>
（例：i18n/rarcompat、i18n/fzzy_config）

【翻譯暫存檔（持久，不會因 rebase 消失）】
TranslatedBundle: %CacheRoot%\<MODID>\bundle_translated.json

【待翻譯輸出（可視為暫存，可能被清掉也沒關係）】
ToTranslateBundle: %OutDir%\<MODID>\bundle_to_translate.json
GeminiPrompt:    %OutDir%\<MODID>\gemini_prompt.txt
StatsJson:       %OutDir%\<MODID>\bundle_source_stats.json（若有）
────────────────────────────────────────────────────────

【Guard Rules（避免卡關/死循環；必須遵守）】
G1: pull/rebase 前若 working tree 非乾淨（git status --porcelain 非空）：
    - git stash push -u -m "codex-auto-stash"
    - 完成後 git stash pop
    - 若 pop 失敗：停止並回報衝突檔案（不得繼續）

G2: apply step 永遠可選：
    - 若 TranslatedBundle 不存在：回報 "apply skipped" 並直接進下一步（不得中止）

G3: make-bundle 後 entries==0 才停止；
    - 1~199 仍需照常輸出（回報 "entries < 200, near completion"）

G4: 重複檢查必須「全量比對」：
    - dup = bundleKeys ∩ existingRepoZhTwKeys
    - 若 dup.length > 0：停止並列出前 50 個 dup keys（不要重試/不要迴圈）

G5: push 失敗：停止並回報錯誤（不得重跑整段流程）

G6: tools/out 與 tools/_cache 必須在 .gitignore；
    - 若 git status 顯示它們被 stage/追蹤：停止並修正 .gitignore（不要硬 commit）

────────────────────────────────────────────────────────
【流程】

0) Git 同步（自動 fallback，不可中止流程）
   cd %RepoRoot%
   git fetch --all --prune

   # G1: auto-stash
   若 git status --porcelain 非空：
     git stash push -u -m "codex-auto-stash"

   git checkout main
   嘗試 git pull --rebase；若失敗 → 改 git pull；若仍失敗 → 回報錯誤但繼續往下做

   # G1: pop stash
   若前面有 stash：
     git stash pop
     若失敗：停止並回報衝突檔案（不得繼續）

1) 準備固定工作分支（禁止 batch）
   - 若 WorkBranch 不存在：
       git checkout -b WorkBranch
     否則：
       git checkout WorkBranch
       git rebase main
       若 rebase 失敗：停止並回報衝突檔案（不得繼續）

2) 套用翻譯（強制驗證 resourcepacks 產物）
   - 確保 %CacheRoot%\<MODID>\ 目錄存在
   - 若 TranslatedBundle 不存在：
       回報 "apply skipped (missing translated bundle at tools/_cache)" 並直接進下一步
     若存在：
       執行 tools\extract-zh-cn-to-zh-tw.ps1 -Overwrite
       回報 Apply summary（totalMods/applied/skipped/created/updated/failed）
       若 failed > 0：停止並列出 failed keys/原因

       【新增：產物驗證（必做）】
       目標檔：resourcepacks\sb4-zh_tw\assets\<MODID>\lang\zh_tw.json
       - 若目標檔不存在：停止並回報 "apply produced no zh_tw.json"
       - 若目標檔存在但本次沒有任何變更（git status 無變更）：
           回報 "apply made no repo changes"（允許繼續產生下一批，但要清楚提示）

3) 產生下一批 keys（最多 200，不重複；只執行一次）
   - 執行 tools\make-gemini-bundle.ps1（TargetModId=<MODID>, KeysPerMod=200）
   - 回報輸出路徑：
       ToTranslateBundle、GeminiPrompt、StatsJson（若有）
   - 讀取 ToTranslateBundle：
       bundleKeys = entries keys 數量
       若 bundleKeys == 0：回報 "no new keys, stop" 並停止（G3）
       若 1 <= bundleKeys < 200：回報 "entries < 200, near completion"（仍需保留輸出）
   - G4 全量重複檢查：
       existingRepoZhTw = resourcepacks\sb4-zh_tw\assets\<MODID>\lang\zh_tw.json keys（不存在視為空）
       dup = intersection(bundleKeys, existingRepoZhTw)
       若 dup.length > 0：停止並列出前 50 個 dup keys（不要重試）

4) 計算並輸出進度（push 前後都要）
   - 自動找出含 assets/<MODID>/lang/en_us.json 的 jar（zip entry 檢查；不要用檔名猜；zip 路徑用 '/'）
     若不存在 fallback assets/<MODID>/lang/en_us.lang
   - total：en_us key 數
   - translated：repo 的 zh_tw.json 與 en_us key 交集數（不存在視為 0）
   - 輸出兩行：
     <MODID> progress: translated=__ / total=__, remaining=__, percent=__._%
     <MODID> source: jar=<jarName>, entry=<entryPath>, totalKeys=<N>

5) Git（有變更才提交；tools/out、tools/_cache 不提交）
   - git status -sb
   - 若沒有任何變更：回報 "no changes, skip commit/push" 並停止
   - 否則：
       確認 .gitignore 已忽略 tools/out/** 與 tools/_cache/**
       git add -A
       commit message："<MODID>: apply bundle and next keys"
       git push --set-upstream origin WorkBranch
       若 push 失敗：停止並回報錯誤（G5）
   - push 後再輸出一次同樣的 progress + source 兩行
────────────────────────────────────────────────────────
