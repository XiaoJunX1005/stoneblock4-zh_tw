請只做「生成整包翻譯進度報表 pack_progress.csv」這件事，不要做翻譯、不套用 bundle、不產生下一批 keys、不做任何 git commit/push。

【固定環境】
RepoRoot: D:\stoneblock4-zh_tw
GameRoot: C:\Users\USER\AppData\Roaming\PrismLauncher\instances\FTB StoneBlock 4\minecraft
ModsDir: %GameRoot%\mods
OutCsv:  D:\stoneblock4-zh_tw\pack_progress.csv

【目標】
在 RepoRoot 產出 pack_progress.csv，並同時在 console 輸出：
- sb4-zh_tw overall progress: translated=__ / total=__, remaining=__, percent=__._%
- 表格前 30 行（modid translated total remaining percent）
- 任何讀取/解析錯誤（不中斷）

【關鍵：正確統計規則（避免「已翻譯卻顯示未翻」）】
對每個 modid：
1) total：以該 mod 的 en_us key 數為準（source-of-truth）
   - 從 ModsDir 內自動找出含 `assets/<modid>/lang/en_us.json` 的 jar
   - 必須用 zip entry 檢查；不得用檔名猜
   - 若找不到 en_us.json，fallback `assets/<modid>/lang/en_us.lang`
   - 若兩者都找不到：該 mod skip（total=0），並記錄原因

2) translated：以 key 對齊為主，並用「en_us 值是否為空」來避免誤判
   - 讀取 repo 的：
     resourcepacks\sb4-zh_tw\assets/<modid>\lang\zh_tw.json
     （不存在視為空）
   - 對每個 key in en_us：
     A) 若 zh_tw 不存在該 key → 未翻譯
     B) 若 zh_tw 存在該 key：
        B1) 若 en_us[key] 是空字串或只含空白（trim 後長度=0）
            → 視為已對齊（不得扣分），不管 zh_tw[key] 是否空
        B2) 否則（en_us 有內容）
            - 若 zh_tw[key] 是空字串或只含空白 → 未翻譯
            - 否則 → 已翻譯
   - translated = 已翻譯數
   - remaining = total - translated
   - percent = translated/total*100（小數 1 位）

3) 解析/格式容錯（不中斷）
   - 若某 jar 內的 en_us.json 不是合法 JSON（例如含註解），記錄錯誤並 skip 該 mod（total=0）
   - 若 zh_tw.json 非法 JSON，記錄錯誤並視為不存在（translated=0）但不中斷全流程

【輸出格式】
pack_progress.csv 需至少包含欄位：
modid,translated,total,remaining,percent
並按 remaining 由大到小排序（其次 total 由大到小）

【實作方式（限制）】
- 可以用 Node.js 或 PowerShell，但必須可在 RepoRoot 直接執行
- 若 RepoRoot 已有既存報表腳本：請優先修正並使用它
- 若沒有：請新增一個腳本（例如 tools\pack-progress.js 或 tools\pack-progress.ps1）
  並且提供一行執行命令

【驗證（必做）】
- 針對 ars_nouveau：
  - 在 console 額外輸出：
    ars_nouveau check: translated=__ total=__ remaining=__
  - 並列出「被判定未翻譯」的 keys 前 20（只列 key），方便人工抽查

【最後回報】
- CSV 實際輸出路徑（OutCsv）
- overall progress 一行
- 表格前 30 行
- errors/warnings 清單（不中斷）
