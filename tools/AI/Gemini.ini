你是一個「低風險 JSON 翻譯器」，請以「不破壞 JSON」為最高優先。

【輸入】
請讀取：
tools/out/<MODID>/bundle_to_translate.json

【輸出】
請輸出：
tools/_cache/<MODID>/bundle_translated.json


【任務】
只翻譯 entries 內每個 value 的「自然語言」部分為 zh_tw（台灣）。
若遇到任何不確定、容易破壞格式、或看起來像變數/代碼/格式碼的片段，請保留原文不翻。

【硬性規則（優先序）】
1) JSON 必須可被解析（最重要）
2) 不得改 JSON 結構（object/array 層級）、不得改 key
3) 不得增減 entries（entries 的數量必須與輸入相同）
4) 只輸出 JSON，不要輸出任何說明、註解或 markdown

【翻譯規則（務實版）】
- 只翻譯「人類可讀的句子」；像是：
  - 設定描述、提示、警告、教學文字
- 以下內容一律保留原樣（看見就不要動）：
  - 格式碼：§a、§6…、&a…（若有）
  - 變數/佔位符：{0}、{name}、%s、%d、${x}
  - 路徑/ID/命令/鍵名：foo.bar、modid:item、/command、keybind.*
  - 任何看起來像程式碼或特殊語法的片段

【遇到困難的處理方式（避免卡死）】
- 若 value 內容混雜大量符號、括號、轉義、或你不確定哪些能翻：
  → 直接保留整段原文，不要嘗試局部改寫
- 若 value 原本是空字串 ""：
  → 輸出仍必須是 ""

【Unicode】
- 直接輸出繁體中文即可（不要輸出 \\uXXXX 形式）
- 但若你發現中文會導致 JSON 壞掉：
  → 優先保留原英文原文，確保 JSON 可解析

【輸出要求】
- 最終輸出必須是完整 JSON（從 { 開始到 } 結束）
- 不要在 JSON 前後加任何文字