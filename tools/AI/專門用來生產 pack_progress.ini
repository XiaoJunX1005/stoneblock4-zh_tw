請只做「生成整包翻譯進度報表 pack_progress.csv（Level 2：以 JAR 的 assets/<namespace>/lang/en_us.* 為準）」。
嚴格禁止修改任何 repo 內既有檔案（包含 tools/ 任何腳本、package.json、.gitignore、README、resourcepacks 等），禁止 git commit/push。
只允許建立資料夾（若不存在）與輸出一個檔案：E:\stoneblock4-zh_tw\tools\AI\pack_progress.csv

【固定環境】
RepoRoot: E:\stoneblock4-zh_tw
GameRoot: C:\Users\sad79\AppData\Roaming\PrismLauncher\instances\FTB StoneBlock 4\minecraft
ModsDir:  %GameRoot%\mods
OutCsv:   E:\stoneblock4-zh_tw\tools\AI\pack_progress.csv

【步驟】
1) 先確認 git 必須乾淨：
   - cd /d E:\stoneblock4-zh_tw
   - git status --porcelain
   - 若輸出非空：停止並列出 dirty 檔案（逐行輸出），不要做任何修改、不要執行後續。

2) 確保輸出資料夾存在（允許建立資料夾）：
   - 若 E:\stoneblock4-zh_tw\tools\AI 不存在：建立它

3) 使用「一次性 PowerShell」直接生成 Level 2 報表（不得呼叫或修改 repo 內任何腳本）：
   - 規則：
     a) 掃描 ModsDir 下所有 *.jar
     b) 讀取 jar 內 assets/*/lang/en_us.json（優先）或 assets/*/lang/en_us.lang
     c) 以 assets/<NS>/... 的 <NS> 作為 namespace（modid），對同一 <NS> 的 key 做 union 去重，得到 total
     d) translated = repo 的 resourcepacks\sb4-zh_tw\assets\<NS>\lang\zh_tw.json 與 total 的交集
     e) 輸出 CSV 欄位至少包含：modid, translated, total, remaining, percent
   - 最後在 console 輸出：
     - sb4-zh_tw overall progress: translated=__ / total=__, remaining=__, percent=__._%
     - 表格前 30 行（modid translated total remaining percent）
     - CSV path: E:\stoneblock4-zh_tw\tools\AI\pack_progress.csv
   - 任何 jar/zh_tw 解析錯誤請用 [WARN] 印出，但不中斷整體流程。

【請直接執行以下 PowerShell 程式（原樣，不要改檔，不要另存成腳本）】
powershell -NoProfile -ExecutionPolicy Bypass -Command ^
 $RepoRoot = 'E:\stoneblock4-zh_tw'; ^
 $GameRoot = 'C:\Users\sad79\AppData\Roaming\PrismLauncher\instances\FTB StoneBlock 4\minecraft'; ^
 $ModsDir  = Join-Path $GameRoot 'mods'; ^
 $OutDir   = Join-Path $RepoRoot 'tools\AI'; ^
 $OutCsv   = Join-Path $OutDir 'pack_progress.csv'; ^
 New-Item -ItemType Directory -Force -Path $OutDir | Out-Null; ^
 Add-Type -AssemblyName System.IO.Compression.FileSystem; ^
 function Get-JsonKeysFromEntry($entry){ try { $s=$entry.Open(); $sr=New-Object System.IO.StreamReader($s,[System.Text.Encoding]::UTF8,$true); $text=$sr.ReadToEnd(); $sr.Close(); $s.Close(); if([string]::IsNullOrWhiteSpace($text)){ return @() } $obj=$text | ConvertFrom-Json; return $obj.PSObject.Properties.Name } catch { return @() } }; ^
 function Get-LangKeysFromEntry($entry){ try { $s=$entry.Open(); $sr=New-Object System.IO.StreamReader($s,[System.Text.Encoding]::UTF8,$true); $set=New-Object 'System.Collections.Generic.HashSet[string]'; while(-not $sr.EndOfStream){ $line=$sr.ReadLine(); if($null -eq $line){ continue } $line=$line.Trim(); if($line.Length -eq 0 -or $line.StartsWith('#')){ continue } $idx=$line.IndexOf('='); if($idx -le 0){ continue } $k=$line.Substring(0,$idx).Trim(); if($k.Length -gt 0){ [void]$set.Add($k) } } $sr.Close(); $s.Close(); return $set.ToArray() } catch { return @() } }; ^
 function Get-ZhTwKeys($path){ if(-not (Test-Path $path)){ return @() } try { $text=Get-Content -Raw -Path $path -Encoding UTF8; if([string]::IsNullOrWhiteSpace($text)){ return @() } $obj=$text | ConvertFrom-Json; return $obj.PSObject.Properties.Name } catch { Write-Host ('[WARN] zh_tw parse failed: {0} => {1}' -f $path,$_.Exception.Message); return @() } }; ^
 $nsKeys=@{}; $nsSources=@{}; ^
 $jarFiles=Get-ChildItem -Path $ModsDir -Filter *.jar -File -ErrorAction Stop; ^
 foreach($jar in $jarFiles){ ^
   try { ^
     $zip=[System.IO.Compression.ZipFile]::OpenRead($jar.FullName); ^
     $entriesJson=$zip.Entries | Where-Object { $_.FullName -match '^assets/[^/]+/lang/en_us\.json$' }; ^
     $entriesLang=$zip.Entries | Where-Object { $_.FullName -match '^assets/[^/]+/lang/en_us\.lang$' }; ^
     foreach($e in $entriesJson){ ^
       $m=[regex]::Match($e.FullName,'^assets/([^/]+)/lang/en_us\.json$'); if(-not $m.Success){ continue }; ^
       $ns=$m.Groups[1].Value; if(-not $nsKeys.ContainsKey($ns)){ $nsKeys[$ns]=New-Object 'System.Collections.Generic.HashSet[string]' }; ^
       $keys=Get-JsonKeysFromEntry $e; foreach($k in $keys){ [void]$nsKeys[$ns].Add($k) }; ^
       if(-not $nsSources.ContainsKey($ns)){ $nsSources[$ns]=@() }; if($nsSources[$ns].Count -lt 5 -and ($nsSources[$ns] -notcontains $jar.Name)){ $nsSources[$ns]+=$jar.Name }; ^
     }; ^
     foreach($e in $entriesLang){ ^
       $m=[regex]::Match($e.FullName,'^assets/([^/]+)/lang/en_us\.lang$'); if(-not $m.Success){ continue }; ^
       $ns=$m.Groups[1].Value; if(-not $nsKeys.ContainsKey($ns)){ $nsKeys[$ns]=New-Object 'System.Collections.Generic.HashSet[string]' }; ^
       $keys=Get-LangKeysFromEntry $e; foreach($k in $keys){ [void]$nsKeys[$ns].Add($k) }; ^
       if(-not $nsSources.ContainsKey($ns)){ $nsSources[$ns]=@() }; if($nsSources[$ns].Count -lt 5 -and ($nsSources[$ns] -notcontains $jar.Name)){ $nsSources[$ns]+=$jar.Name }; ^
     }; ^
     $zip.Dispose(); ^
   } catch { ^
     Write-Host ('[WARN] jar read failed: {0} => {1}' -f $jar.FullName,$_.Exception.Message); ^
     try { if($zip){ $zip.Dispose() } } catch {} ^
   } ^
 }; ^
 $rows=New-Object 'System.Collections.Generic.List[object]'; ^
 foreach($ns in ($nsKeys.Keys | Sort-Object)){ ^
   $total=$nsKeys[$ns].Count; ^
   $zhPath=Join-Path $RepoRoot ('resourcepacks\sb4-zh_tw\assets\{0}\lang\zh_tw.json' -f $ns); ^
   $zhKeys=Get-ZhTwKeys $zhPath; ^
   $zhSet=New-Object 'System.Collections.Generic.HashSet[string]'; foreach($k in $zhKeys){ [void]$zhSet.Add($k) }; ^
   $translated=0; foreach($k in $nsKeys[$ns]){ if($zhSet.Contains($k)){ $translated++ } }; ^
   $remaining=$total-$translated; ^
   $pct= if($total -eq 0){ 0 } else { [math]::Round(($translated/$total)*100,1) }; ^
   $rows.Add([pscustomobject]@{ modid=$ns; translated=$translated; total=$total; remaining=$remaining; percent=('{0}%' -f $pct) }) | Out-Null; ^
 }; ^
 $rows | Sort-Object -Property remaining -Descending | Export-Csv -Path $OutCsv -NoTypeInformation -Encoding UTF8; ^
 $csv=Import-Csv $OutCsv; ^
 $tTranslated=($csv | Measure-Object -Property translated -Sum).Sum; ^
 $tTotal=($csv | Measure-Object -Property total -Sum).Sum; ^
 $tRemaining=$tTotal-$tTranslated; ^
 $overallPct= if($tTotal -eq 0){ 0 } else { [math]::Round(($tTranslated/$tTotal)*100,1) }; ^
 Write-Host ('sb4-zh_tw overall progress: translated={0} / total={1}, remaining={2}, percent={3}%' -f $tTranslated,$tTotal,$tRemaining,$overallPct); ^
 $csv | Select-Object -First 30 -Property modid,translated,total,remaining,percent | Format-Table -AutoSize; ^
 Write-Host ('CSV path: {0}' -f $OutCsv);"

4) 執行後驗證（不得修正、不得復原）：
   - 確認 OutCsv 存在：Test-Path E:\stoneblock4-zh_tw\tools\AI\pack_progress.csv
   - 再跑一次 git status --porcelain
   - 若出現任何「除了 OutCsv 以外」的 dirty 檔案：停止並列出（逐行輸出），不要做任何修改。

